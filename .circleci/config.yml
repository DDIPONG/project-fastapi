# This config was automatically generated from your source code
# Stacks detected: cicd:github-actions:.github/workflows,deps:python:.
version: 2.1
orbs:
  python: circleci/python@2
jobs:
  test-python:
    # Install dependencies and run tests
    docker:
      - image: cimg/python:3.8-node
    steps:
      - checkout
      - python/install-packages
      - run:
          name: Run tests
          command: pytest --junitxml=junit.xml || ((($? == 5)) && echo 'Did not find any tests to run.')
      - store_test_results:
          path: junit.xml
  deploy:
    # This is an example deploy job, not actually used by the workflow
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Plan deployment
          command: |-
            circleci run release plan deploy \
              --environment-name="default" \
              --component-name="deploy" \
              --target-version="1.0.${CIRCLE_BUILD_NUM}-${CIRCLE_SHA1:0:7}"
      # Replace this with steps to deploy to users
      - run:
          name: deploy
          command: '#e.g. ./deploy.sh'
      - run:
          name: found github actions config
          command: ':'
      - run:
          name: Update deployment status to running
          command: circleci run release update deploy --status=RUNNING
      - run:
          name: Update deployment status to success
          command: circleci run release update deploy --status=SUCCESS
          when: on_success
      - run:
          name: Update deployment status to failed
          command: circleci run release update deploy --status=FAILED
          when: on_fail
  docker-build:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: Build Docker image
          command: docker build -t project-fastapi .
      - run:
          name: Docker image save
          command: docker save -o project-fastapi.tar project-fastapi
      - persist_to_workspace:
          root: .
          paths:
            - project-fastapi.tar
  ecr-push:
    machine:
      image: ubuntu-2204:current

    steps:
      - attach_workspace:
          at: .
      - run:
          name: Load Docker image
          command: docker load -i project-fastapi.tar
      - run:
          name: Assume AWS IAM Role
          command: |
            CREDS=$(aws sts assume-role-with-web-identity \
              --role-arn arn:aws:iam::445960198177:role/CircleCI-ECR-Push-Role \
              --role-session-name circleci-${CIRCLE_WORKFLOW_ID} \
              --web-identity-token "$CIRCLE_OIDC_TOKEN_V2" \
              --duration-seconds 3600)

            echo "export AWS_ACCESS_KEY_ID=$(echo $CREDS | jq -r '.Credentials.AccessKeyId')" >> "$BASH_ENV"
            echo "export AWS_SECRET_ACCESS_KEY=$(echo $CREDS | jq -r '.Credentials.SecretAccessKey')" >> "$BASH_ENV"
            echo "export AWS_SESSION_TOKEN=$(echo $CREDS | jq -r '.Credentials.SessionToken')" >> "$BASH_ENV"
      - run:
          name: Login to Amazon ECR
          command: |
            aws ecr get-login-password --region ap-northeast-2 \
              | docker login \
                  --username AWS \
                  --password-stdin 445960198177.dkr.ecr.ap-northeast-2.amazonaws.com
      - run:
          name: Tag Docker image
          command: |
            docker tag project-fastapi:latest \
              445960198177.dkr.ecr.ap-northeast-2.amazonaws.com/project-fastapi:latest
      - run:
          name: Push Docker image to ECR
          command: |
            docker push \
              445960198177.dkr.ecr.ap-northeast-2.amazonaws.com/project-fastapi:latest
workflows:
  build-and-test:
    jobs:
      - test-python
      # - deploy:
      #     requires:
      #       - test-python
      - docker-build:
          requires:
            - test-python
      - ecr-push:
          requires:
            - docker-build
