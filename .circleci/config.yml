# This config was automatically generated from your source code
# Stacks detected: cicd:github-actions:.github/workflows,deps:python:.
version: 2.1
orbs:
  python: circleci/python@2
jobs:
  test-python:
    # Install dependencies and run tests
    docker:
      - image: cimg/python:3.8-node
    steps:
      - checkout
      - python/install-packages
      - run:
          name: Run tests
          command: pytest --junitxml=junit.xml || ((($? == 5)) && echo 'Did not find any tests to run.')
      - store_test_results:
          path: junit.xml
  deploy:
    # This is an example deploy job, not actually used by the workflow
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Plan deployment
          command: |-
            circleci run release plan deploy \
              --environment-name="default" \
              --component-name="deploy" \
              --target-version="1.0.${CIRCLE_BUILD_NUM}-${CIRCLE_SHA1:0:7}"
      # Replace this with steps to deploy to users
      - run:
          name: deploy
          command: '#e.g. ./deploy.sh'
      - run:
          name: found github actions config
          command: ':'
      - run:
          name: Update deployment status to running
          command: circleci run release update deploy --status=RUNNING
      - run:
          name: Update deployment status to success
          command: circleci run release update deploy --status=SUCCESS
          when: on_success
      - run:
          name: Update deployment status to failed
          command: circleci run release update deploy --status=FAILED
          when: on_fail
  docker-build:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: Build Docker image
          command: docker build -t project-fastapi .
      - run:
          name: Docker image save
          command: docker save -o project-fastapi.tar project-fastapi
      - persist_to_workspace:
          root: .
          paths:
            - project-fastapi.tar
  ecr-push:
    machine:
      image: ubuntu-2204:current

    steps:
      - attach_workspace:
          at: .
      - run:
          name: Load Docker image
          command: docker load -i project-fastapi.tar
      - run:
          name: Check OIDC token
          command: |
            echo "$CIRCLE_OIDC_TOKEN_V2" | cut -d '.' -f2 | base64 -d 2>/dev/null | jq .

workflows:
  build-and-test:
    jobs:
      - test-python
      # - deploy:
      #     requires:
      #       - test-python
      - docker-build:
          requires:
            - test-python
      - ecr-push:
          requires:
            - docker-build
